# Dependabot 버전 업데이트 (PM 10/16). 보안 경고·보안 PR은 저장소 설정을 따르고 이 파일과 무관하다.
# - 큰 버전(major)은 자동 PR을 만들지 않는다 — 필요할 때 사람이 따로 계획한다 (예: react-router 7, #148)
# - 작은 버전(minor·patch)은 생태계마다 한 PR로 묶는다 → 주마다 많아야 생태계당 1개
# - backend requirements.txt는 uv로 해시 고정(tests/test_requirements_lock.py)이라, Dependabot PR이 오면
#   `uv pip compile requirements.in --universal --python-version 3.12 --generate-hashes -o requirements.txt`로 다시 만든다
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    # python:3.12-slim — 3.13 같은 minor도 런타임이 바뀌므로 자동 PR에서 뺀다 (patch 태그만)
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
